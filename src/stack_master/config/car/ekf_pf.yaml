# robot_localization EKF for RACING, fusing the particle filter with wheel odometry.
#
# This is the node that produces /car_state/odom, which the controller and the
# planners all consume. It also owns the map -> ego_racecar/base_link transform
# while racing, the way cartographer owns it while mapping. Never run both.
#
# The split is the point:
#   /pf/pose/odom   absolute position and heading, accurate but low rate and
#                   it jumps when the filter resamples
#   /vesc/odom      forward speed and yaw rate, high rate and smooth, but it
#                   drifts without bound
# Taking pose from one and velocity from the other gives a 100 Hz pose that is
# both smooth and absolute. Neither source is used for what it is bad at, which
# is why the config vectors below are so sparse.
#
# odom_frame is set to the base link rather than an actual odom frame: with
# world_frame = map and two_d_mode, that keeps robot_localization publishing a
# single map -> base_link edge instead of trying to split it through an odom
# frame that nothing else in this stack maintains.

ekf_localization:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: true

    # This node owns map -> ego_racecar/base_link. The particle filter's own
    # publish_tf must stay false (see pf.yaml).
    publish_tf: true

    map_frame:       map
    odom_frame:      ego_racecar/base_link
    base_link_frame: ego_racecar/base_link
    world_frame:     map

    # --- wheel odometry: velocities only ---
    #             x      y      z
    #             roll   pitch  yaw
    #             vx     vy     vz
    #             vroll  vpitch vyaw
    #             ax     ay     az
    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 5
    odom0_nodelay: true

    # --- particle filter: absolute pose only ---
    odom1: /pf/pose/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 5
    odom1_nodelay: true

    use_control: false
